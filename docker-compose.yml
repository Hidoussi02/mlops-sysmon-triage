
services:
  sysmon-api:
    build: .
    image: sysmon-triage-api:latest

    # Gunicorn configuration
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - --timeout
      - "60"
      - --worker-tmp-dir
      - /tmp
      - app:app

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ./model:/app/model:ro

    environment:
      MODEL_DIR: /app/model
      INPUT_FIELD: rule_description
      THRESHOLD: "0.5"
      HOME: /tmp
      
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
