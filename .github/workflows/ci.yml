name: CI

on:
  push:
    branches: [main, devsecops-upgrade, 'dev/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ----------------------------------------------------------
  # Job 1 - Secrets, SAST, SCA (dependances), lint et tests
  # ----------------------------------------------------------
  quality:
    name: Secrets, SAST, SCA, lint & tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks (blocking, redacted)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --no-git --redact --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --timeout 300 --retries 10 \
            -r requirements.txt flake8 pytest bandit

      - name: Lint with flake8
        run: flake8 app.py export_model.py train.py ci tests

      - name: SAST security scan with Bandit (blocking on Medium/High)
        run: bandit -q -r app.py export_model.py train.py ci -ll

      - name: Dependency scan with Trivy FS (blocking on fixable CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 /src
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --severity CRITICAL --ignore-unfixed --exit-code 1 /src

      - name: Run unit tests
        run: pytest -v

  # ----------------------------------------------------------
  # Job 2 - Build multi-stage, Trivy image scan & smoke-tests
  # ----------------------------------------------------------
  docker:
    name: Build, Trivy image scan & hardened smoke-test
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the multi-stage Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
            -t sysmon-api:ci .

      - name: Container image scan with Trivy (blocking on fixable CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 sysmon-api:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 sysmon-api:ci

      - name: Install dependencies and create dummy model
        run: |
          python -m pip install --timeout 300 --retries 10 -r requirements.txt
          rm -rf model-ci
          python ci/make_dummy_model.py model-ci

      - name: Start hardened Docker container
        run: |
          docker run -d --name sysmon-api \
            -p 127.0.0.1:5000:5000 \
            -v "$PWD/model-ci:/app/model:ro" \
            -e MODEL_DIR=/app/model \
            -e API_SECRET_KEY=ci-ephemeral-test-secret \
            -e DEMO_ANALYST_PASS=ci-analyst-test-password \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint gunicorn \
            sysmon-api:ci \
            --bind 0.0.0.0:5000 \
            --workers 2 \
            --timeout 60 \
            --worker-tmp-dir /tmp \
            app:app

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: API did not become healthy"
          exit 1

      - name: Check non-root container user and no .git inside image
        run: |
          USER_ID=$(docker exec sysmon-api id -u)
          echo "Container user ID: $USER_ID"
          test "$USER_ID" = "10001"
          test ! -d "$(docker exec sysmon-api sh -c 'test -d /app/.git && echo yes || echo no')" || true
          docker exec sysmon-api sh -c 'test ! -d /app/.git'

      - name: Test authentication and /predict endpoint
        run: |
          unauth_status=$(curl -sS -o unauthenticated.json -w "%{http_code}" -X POST http://127.0.0.1:5000/predict -H "Content-Type: application/json" -d '{"rule_description":"Unauthorized CI test"}')
          test "$unauth_status" = "401"

          login_response=$(curl -fsS -X POST http://127.0.0.1:5000/login -H "Content-Type: application/json" -d '{"username":"analyst","password":"ci-analyst-test-password"}')
          token=$(printf '%s' "$login_response" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          test -n "$token"

          curl -fsS -X POST http://127.0.0.1:5000/predict -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"rule_description":"PowerShell executed an encoded command variant 7"}' | tee response.json

          python -c 'import json; d=json.load(open("response.json")); assert d["prediction"] in (0, 1); assert 0 <= d["probability"] <= 1'

      - name: Show container logs if something failed
        if: failure()
        run: |
          if docker container inspect sysmon-api >/dev/null 2>&1; then
            docker logs sysmon-api
          else
            echo "Container was not created."
          fi

      - name: Clean up
        if: always()
        run: |
          docker rm -f sysmon-api || true
          