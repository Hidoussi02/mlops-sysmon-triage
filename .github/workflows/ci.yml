
# CI pipeline - runs on every push / pull request to main.
# CI generates a synthetic model to test the API without real training data.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read-only access to repository contents
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ----------------------------------------------------------
  # Job 1 - Code quality, security scanning and unit tests
  # ----------------------------------------------------------
  quality:
    name: Lint, security scan, tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --timeout 300 --retries 10 \
            -r requirements.txt flake8 pytest bandit

      - name: Lint with flake8
        run: flake8 app.py export_model.py train.py ci tests

      - name: Security scan with Bandit
        run: bandit -q -r app.py export_model.py train.py ci -ll

      - name: Run unit tests
        run: pytest -v

  # ----------------------------------------------------------
  # Job 2 - Docker build and hardened container smoke tests
  # ----------------------------------------------------------
  docker:
    name: Build and smoke-test the container
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the Docker image
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
            -t sysmon-api:ci .

      # Use model-ci instead of model because model may already
      # contain tracked MLflow artifacts in the repository.
      - name: Install dependencies and create dummy model
        run: |
          python -m pip install --timeout 300 --retries 10 -r requirements.txt
          rm -rf model-ci
          python ci/make_dummy_model.py model-ci

      - name: Start hardened Docker container
        run: |
          docker run -d --name sysmon-api \
            -p 127.0.0.1:5000:5000 \
            -v "$PWD/model-ci:/app/model:ro" \
            -e MODEL_DIR=/app/model \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint gunicorn \
            sysmon-api:ci \
            --bind 0.0.0.0:5000 \
            --workers 2 \
            --timeout 60 \
            --worker-tmp-dir /tmp \
            app:app

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: API did not become healthy"
          exit 1

      - name: Check non-root container user
        run: |
          USER_ID=$(docker exec sysmon-api id -u)
          echo "Container user ID: $USER_ID"
          test "$USER_ID" = "10001"

      - name: Test /predict endpoint
        run: |
          curl -fsS \
            -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"rule_description":"PowerShell executed an encoded command variant 7"}' \
            | tee response.json

          python -c 'import json; d=json.load(open("response.json")); assert d["prediction"] in (0, 1); assert 0 <= d["probability"] <= 1'

      - name: Show container logs if something failed
        if: failure()
        run: |
          if docker container inspect sysmon-api >/dev/null 2>&1; then
            docker logs sysmon-api
          else
            echo "Container was not created."
          fi

      - name: Clean up
        if: always()
        run: |
          docker rm -f sysmon-api || true
