# CI pipeline - runs on every push / pull request to main.
# Idea: the real model and dataset are NOT in GitHub (.gitignore), so CI builds a
# tiny fake model with the same libraries and tests the API against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the pipeline can only READ the repository
permissions:
  contents: read

env:
  # Keep identical to your laptop (python --version) and to the Dockerfile ARG
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # Job 1 - code quality and security: lint, static security scan, unit tests
  # --------------------------------------------------------------------------
  quality:
    name: Lint, security scan, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 pytest bandit

      - name: Lint with flake8 (syntax and style)
        run: flake8 app.py export_model.py train.py ci tests

      - name: Security scan with Bandit (medium severity and above)
        run: bandit -q -r app.py export_model.py train.py ci -ll

      - name: Run unit tests (uses a dummy model, no real data)
        run: pytest -v

  # --------------------------------------------------------------------------
  # Job 2 - container: build the image, run it hardened, call the API
  # --------------------------------------------------------------------------
  docker:
    name: Build and smoke-test the container
    needs: quality                    # only runs if job 1 passed
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python (to generate the dummy model)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the Docker image
        run: docker build --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} -t sysmon-api:ci .

      - name: Create the dummy model folder
        run: |
          pip install -r requirements.txt
          python ci/make_dummy_model.py model

      - name: Start the container with the same hardening as docker-compose
        run: |
          docker run -d --name sysmon-api \
            -p 127.0.0.1:5000:5000 \
            -v "$PWD/model:/app/model:ro" \
            -e MODEL_DIR=/app/model \
            --read-only --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            sysmon-api:ci

      - name: Wait for /health to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Check that the container does not run as root
        run: test "$(docker exec sysmon-api id -u)" = "10001"

      - name: Call /predict
        run: |
          curl -fsS -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"rule_description":"PowerShell executed an encoded command variant 7"}' \
            | tee response.json
          grep -q '"prediction"' response.json

      - name: Show container logs if something failed
        if: failure()
        run: docker logs sysmon-api

      - name: Clean up
        if: always()
        run: docker rm -f sysmon-api